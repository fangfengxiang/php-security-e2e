name: PHP 7.0 E2E Evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
concurrency:
  group: php70-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      report_ready: ${{ steps.report.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reporter regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Checkout actual PHP PR head
        id: source
        uses: actions/checkout@v4
        with:
          repository: fangfengxiang/php-src
          ref: refs/pull/1/head
          path: php-source
          fetch-depth: 0
      - name: Record source and runner identity
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
          HARNESS_COMMIT: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          value=dict(run_id=os.environ['RUN_ID'], attempt=os.environ['ATTEMPT'], repository=os.environ['REPO'], harness_commit=os.environ['HARNESS_COMMIT'], event=os.environ['EVENT'], runner_platform=platform.platform(), source_pr='https://github.com/fangfengxiang/php-src/pull/1')
          try: value['source_commit']=subprocess.check_output(['git','-C','php-source','rev-parse','HEAD'],text=True).strip()
          except subprocess.CalledProcessError: value['source_commit']=None
          Path(os.environ['RUNNER_TEMP'],'run-metadata.json').write_text(json.dumps(value,indent=2))
          PY
      - name: Run three-build noninstrumented verification
        id: e2e
        if: steps.source.outcome == 'success'
        continue-on-error: true
        run: python3 php70/run.py --source php-source --ref HEAD --output "$RUNNER_TEMP/php70-e2e" --jobs 2
      - name: Run C instrumentation comparison
        id: trace
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        continue-on-error: true
        run: |
          docker image inspect php-cve-e2e:php70 >/dev/null
          python3 php70/trace-run.py --source php-source --ref HEAD --image php-cve-e2e:php70 --output "$RUNNER_TEMP/php70-trace" --jobs 2
      - name: Generate report even for failed or incomplete tests
        id: report
        if: always()
        run: |
          python3 tools/report.py --e2e "$RUNNER_TEMP/php70-e2e" --trace "$RUNNER_TEMP/php70-trace" --metadata "$RUNNER_TEMP/run-metadata.json" --output "$RUNNER_TEMP/php70-report"
          {
            cat "$RUNNER_TEMP/php70-report/job-summary.md"
            echo "[Download report and raw evidence](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "[Live report / latest published main run](https://fangfengxiang.github.io/php-cve-e2e/)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Archive offline HTML and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php70-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/php70-report/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce test outcomes after preserving evidence
        if: always()
        env:
          E2E: ${{ steps.e2e.outcome }}
          TRACE: ${{ steps.trace.outcome }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path(os.environ['RUNNER_TEMP'],'php70-report/summary.json').read_text())
          if not report['pass'] or os.environ['E2E']!='success' or os.environ['TRACE']!='success': raise SystemExit('Verification failed or incomplete; see retained report')
          PY
  publish:
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify.outputs.report_ready == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: php70-pages-history
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: php70-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/incoming-report
      - name: Restore explicit report history branch
        run: |
          if git ls-remote --exit-code origin refs/heads/e2e-pages; then
            git fetch --depth=1 origin e2e-pages
            git worktree add --detach "$RUNNER_TEMP/pages-history" FETCH_HEAD
            git -C "$RUNNER_TEMP/pages-history" checkout -B e2e-pages
          else
            git worktree add --detach "$RUNNER_TEMP/pages-history" HEAD
            git -C "$RUNNER_TEMP/pages-history" checkout --orphan e2e-pages
            git -C "$RUNNER_TEMP/pages-history" rm -rf .
          fi
      - name: Append current report, including failures
        run: |
          python3 tools/publish_history.py --site "$RUNNER_TEMP/pages-history" --report "$RUNNER_TEMP/incoming-report" --run-id '${{ github.run_id }}' --attempt '${{ github.run_attempt }}'
          git -C "$RUNNER_TEMP/pages-history" config user.name github-actions[bot]
          git -C "$RUNNER_TEMP/pages-history" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$RUNNER_TEMP/pages-history" add .
          git -C "$RUNNER_TEMP/pages-history" commit -m 'Record E2E report ${{ github.run_id }} attempt ${{ github.run_attempt }}'
          git -C "$RUNNER_TEMP/pages-history" push origin HEAD:refs/heads/e2e-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-history
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
