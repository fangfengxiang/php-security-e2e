worker_processes 1;
pid /tmp/e2e/nginx.pid;
error_log /evidence/nginx-error.log notice;
events { worker_connections 32; }
http {
    access_log /evidence/access.log combined;
    lua_package_path '/integration/upstream/detection/?.lua;;';
    client_body_temp_path /tmp/e2e/body;
    server {
        listen 127.0.0.1:8080;
        location / {
            access_by_lua_block {
                require('php2shell').check({log_only = ngx.var.uri == '/log-only'})
            }
            content_by_lua_block { ngx.say('BACKEND_FIXTURE_REACHED') }
        }
    }
}
